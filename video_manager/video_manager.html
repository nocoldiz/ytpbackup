<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Manager - YTP Archive</title>
  <link rel="stylesheet" href="/docs/style.css">
  <style>
    body { padding: 20px; }
    .manager-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .selection-info {
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .btn-ban {
      background: #dc3545;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-ban:hover { background: #bb2d3b; }
    .btn-ban:disabled { background: #6c757d; cursor: not-allowed; }
    
    .btn-source {
      background: #198754;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-source:hover { background: #157347; }
    .btn-source:disabled { background: #6c757d; cursor: not-allowed; }

    .badge-source {
      background: #198754;
      color: white;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      text-transform: uppercase;
      font-weight: bold;
    }
    
    .select-col { width: 40px; text-align: center; }
    input[type="checkbox"] { transform: scale(1.2); }
    
    .btn-filter {
      background: var(--bg-secondary, #f8f9fa);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .btn-filter.active {
      background: #007bff;
      color: white;
      border-color: #0056b3;
    }
    
    /* Adapt some index.html styles that might be missing or scoped */
    #video-table { width: 100%; border-collapse: collapse; }
    .page { display: block !important; }
  </style>
</head>
<body>
  <div class="manager-header">
    <div>
      <h1>Video Manager</h1>
      <p class="selection-info" id="selection-summary">0 videos selected</p>
    </div>
    <div>
      <button id="btn-flag-source-selected" class="btn-source" disabled>Flag as Source</button>
      <button id="btn-ban-selected" class="btn-ban" disabled>Ban Selected Videos</button>
      <a href="/" class="nav-tab" style="display:inline-block; margin-left:10px; text-decoration:none; padding:8px 15px; border:1px solid var(--border); border-radius:6px; color:var(--text)">Back to Dashboard</a>
    </div>
  </div>

  <div class="page" id="page-videos">
    <div class="section-header">
      <h2>Video Search</h2>
      <span class="count-badge" id="videos-count-label"></span>
    </div>
    
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search title, channel, tags, thread, description, video ID...">
      <button id="btn-filter-non-ytp" class="btn-filter">Non-YTP Keywords</button>
      <select id="filter-status">
        <option value="">All statuses</option>
        <option value="downloaded">Downloaded</option>
        <option value="pending">Pending</option>
        <option value="unavailable">Unavailable</option>
      </select>
      <select id="filter-section">
        <option value="">All sections</option>
      </select>
      <select id="filter-language" class="tag-list">
        <option value="any">Any language</option>
        <option value="english">🇬🇧 English</option>
        <option value="italian">🇮🇹 Italian</option>
        <option value="spanish">🇪🇸 Spanish</option>
        <option value="russian">🇷🇺 Russian</option>
        <option value="french">🇫🇷 French</option>
        <option value="german">🇩🇪 German</option>
      </select>
      <input type="text" id="filter-channel" list="channel-datalist" placeholder="All channels">
      <datalist id="channel-datalist"></datalist>
    </div>

    <div class="search-bar">
      <label>Views ≥</label>
      <div class="range-group">
        <input type="number" id="filter-views-min" placeholder="0">
      </div>
      <label>Likes ≥</label>
      <div class="range-group">
        <input type="number" id="filter-likes-min" placeholder="0">
      </div>
      <label>Year:</label>
      <select id="filter-year">
        <option value="">Any year</option>
      </select>
    </div>

    <div class="table-wrap">
      <table id="video-table">
        <thead>
          <tr>
            <th class="select-col"><input type="checkbox" id="select-all"></th>
            <th data-field="title" onclick="sortTable('title')" style="cursor:pointer">Title / ID <span class="sort-arrow">↕</span></th>
            <th data-field="channel_name" onclick="sortTable('channel_name')" style="cursor:pointer">Channel <span class="sort-arrow">↕</span></th>
            <th data-field="publish_date" onclick="sortTable('publish_date')" style="cursor:pointer">Date <span class="sort-arrow">↕</span></th>
            <th data-field="view_count" onclick="sortTable('view_count')" style="cursor:pointer">Views <span class="sort-arrow">↕</span></th>
            <th data-field="like_count" onclick="sortTable('like_count')" style="cursor:pointer">Likes <span class="sort-arrow">↕</span></th>
            <th data-field="status" onclick="sortTable('status')" style="cursor:pointer">Status <span class="sort-arrow">↕</span></th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="video-tbody">
          <tr><td colspan="8" class="empty">Loading videos...</td></tr>
        </tbody>
      </table>
    </div>
    <div id="scroll-sentinel" style="height: 1px;"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <script src="/video_manager_client.js"></script>
</body>
</html>
